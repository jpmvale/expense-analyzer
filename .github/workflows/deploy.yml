name: deploy

# Só em `main`, e só depois do CI passar. `workflow_run` em vez de `needs:`
# porque o CI é um workflow separado — assim não há um segundo lugar
# descrevendo o que precisa passar antes de publicar.
on:
  workflow_run:
    # Nome EXATO do outro workflow (`name:` do ci.yml), com maiúsculas e tudo.
    # O casamento é literal: escrever "ci" aqui faz o deploy nunca disparar, sem
    # erro nenhum em lugar nenhum.
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Escotilha manual: republicar o commit atual sem precisar de um push vazio.
  # Note que ela PULA o portão de qualidade — é para reparo, não para o dia a dia.
  workflow_dispatch:

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  publicar:
    # Sem esta condição um CI vermelho ainda dispararia o deploy: `workflow_run`
    # roda em qualquer conclusão, inclusive falha.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          # Em workflow_run o checkout default é o do evento, não o do commit
          # testado. Sem isto, a imagem publicada poderia não ser a que passou
          # no CI — que é justamente a garantia que esta esteira existe para dar.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: sha curto
        id: sha
        run: echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build e push da api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/jpmvale/expense-api:${{ steps.sha.outputs.tag }}
            ghcr.io/jpmvale/expense-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build e push do web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # O Vite grava esta URL DENTRO do bundle, em tempo de build. Sem
          # repetir aqui o mesmo valor do docker-compose.prod.yml, a imagem sai
          # apontando para o default de desenvolvimento e o site publicado
          # chama uma API que não existe — falha que só aparece no navegador,
          # nunca no build.
          build-args: |
            VITE_API_URL=https://expenses.imp-software.cloud/api
          tags: |
            ghcr.io/jpmvale/expense-web:${{ steps.sha.outputs.tag }}
            ghcr.io/jpmvale/expense-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Publicado embora não seja implantado: quem o executa é o cron das 07:00
      # na VPS, por `compose run --rm`. Sem a imagem pronta, a máquina de
      # produção voltaria a compilar.
      - name: build e push do extractor
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/extractor/Dockerfile
          push: true
          tags: |
            ghcr.io/jpmvale/expense-extractor:${{ steps.sha.outputs.tag }}
            ghcr.io/jpmvale/expense-extractor:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: publicar na VPS
        env:
          CHAVE: ${{ secrets.VPS_DEPLOY_KEY }}
          MAQUINA: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          # `%s\n` e não `%s`: chave OpenSSH SEM quebra de linha final é
          # recusada com "error in libcrypto", e o GitHub apara o newline
          # terminal ao guardar o secret.
          printf '%s\n' "$CHAVE" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy

          # Falha cedo e com mensagem clara se a chave chegou corrompida, em vez
          # de deixar o ssh reportar um "Permission denied (publickey)" genérico
          # que manda procurar no lugar errado (authorized_keys da VPS).
          ssh-keygen -y -f ~/.ssh/deploy > /dev/null \
            || { echo "::error::a chave privada em VPS_DEPLOY_KEY está malformada"; exit 1; }

          ssh-keyscan -H "$MAQUINA" >> ~/.ssh/known_hosts 2>/dev/null

          # A chave está presa a um forced command na VPS: este texto chega em
          # SSH_ORIGINAL_COMMAND e é validado lá contra uma lista fechada de
          # apps e um regex de sha. Não é um shell.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            deploy@"$MAQUINA" "expense-analyzer ${{ steps.sha.outputs.tag }}"
