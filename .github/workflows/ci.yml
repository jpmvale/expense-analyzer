name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um PR que recebe vários pushes cancela as execuções antigas.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest

    env:
      # Explícito em vez de deixar a biblioteca escolher: o padrão dela depende
      # de o home ser gravável e cai em `node_modules` quando não é. O cache
      # abaixo aponta para este mesmo caminho, e um cache que erra o diretório em
      # silêncio é pior que nenhum, porque parece estar funcionando.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      # Os testes de service sobem um MongoDB de verdade em memória, e o binário
      # do mongod é baixado na primeira execução. Sem cache seriam ~77 MB em toda
      # corrida; a chave é o sistema operacional porque o binário é dele.
      - name: cache do binário do mongod
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  smoke:
    name: smoke test da API
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 10

    env:
      MONGO_URI: mongodb://localhost:27017/credit-card
      PORT: 3000
      # Credenciais DESCARTÁVEIS, válidas só dentro deste job efêmero. Não são
      # segredo e não precisam virar secret do repositório: a API sobe aqui
      # contra um Mongo de mentira que morre junto com o runner, e nada disso
      # existe em produção — lá os valores vêm do .env.prod da VPS.
      #
      # Estão aqui porque a API passou a exigi-las no boot (guard de sessão
      # global) e o smoke quebrou sem elas. O hash é de "ci-smoke-descartavel",
      # gerado com `pnpm --filter @expense/api hash-password`.
      SESSION_SECRET: ci-smoke-descartavel-nao-usar-em-producao
      AUTH_USERNAME: ci
      AUTH_PASSWORD_HASH: $2b$12$91/IvMSuKsdMP20bj6xr0OqWs8Rjf2hWhlnCFitkf2tctqRKSyMHq

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Popula o banco com as faturas fictícias e confere que a API responde
      # com dados de verdade — pega quebras de contrato entre extractor e API.
      - run: pnpm db:seed

      - name: subir a API e consultar os endpoints
        run: |
          pnpm --filter @expense/api start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && break
            sleep 1
          done

          # /health é @Public(), o resto não: o guard de sessão é global, então
          # sem login estes endpoints devolvem 401 e o `-f` derruba o job. O
          # cookie jar carrega a sessão do login para as chamadas seguintes.
          curl -sf -c cookies.txt -X POST http://localhost:3000/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci","password":"ci-smoke-descartavel"}' | grep -q '"username"'

          curl -sf -b cookies.txt http://localhost:3000/purchase | grep -q '"total"'
          curl -sf -b cookies.txt http://localhost:3000/purchase/bill | grep -q '"month"'

          # Só a leitura do estado — disparar POST /sync aqui leria faturas que
          # não existem no runner. O que esta linha protege é a fiação: o módulo
          # de sync carrega o pacote de ingestão, que arrasta o googleapis, e uma
          # dependência que não sobrevive ao build derruba a API inteira no boot.
          curl -sf -b cookies.txt http://localhost:3000/sync | grep -q '"running"'

          # Prova que o guard está mesmo protegendo: sem cookie tem que dar 401.
          # Sem esta linha, um dia em que o guard fosse removido por engano o
          # smoke continuaria verde.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/purchase)" = "401"
