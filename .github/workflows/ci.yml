name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um PR que recebe vários pushes cancela as execuções antigas.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  smoke:
    name: smoke test da API
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 10

    env:
      MONGO_URI: mongodb://localhost:27017/credit-card
      PORT: 3000

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Popula o banco com as faturas fictícias e confere que a API responde
      # com dados de verdade — pega quebras de contrato entre extractor e API.
      - run: pnpm db:seed

      - name: subir a API e consultar os endpoints
        run: |
          pnpm --filter @expense/api start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && break
            sleep 1
          done
          curl -sf http://localhost:3000/purchase | grep -q '"total"'
          curl -sf http://localhost:3000/purchase/bill | grep -q '"month"'
